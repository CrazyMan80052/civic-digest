name: CI — PR Failure Reporter & Auto-Heal

on:
  workflow_run:
    workflows: ["CI — Monorepo PR Verification"]
    types: [completed]

permissions:
  pull-requests: write
  issues: write

jobs:
  report-failure:
    name: Annotate CI Failure on PR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    steps:
      - name: Report CI Failure Details to PR
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests;
            if (!prs || prs.length === 0) {
              console.log("No pull request associated with this run.");
              return;
            }

            const prNumber = prs[0].number;
            const runUrl = run.html_url;

            const body = `🚨 **CI Verification Failed**\n\nThe monorepo CI run failed on this branch.\n- **Run Details:** [View Workflow Logs](${runUrl})\n\n### Self-Healing with Jules:\nTo instruct Jules to fix this failure automatically, comment below:\n\`\`\`text\n/jules The CI build/test failed on this branch. Review the workflow logs at ${runUrl}, run the tests locally, and fix the errors.\n\`\`\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
